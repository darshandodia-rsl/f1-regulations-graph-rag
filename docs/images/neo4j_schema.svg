<text x="1074" y="584" font-weight="bold" fill="#333">Search indexes</text>
<text x="1074" y="602" font-size="11" fill="#666">embeddings: BAAI/bge-small-en-v1.5 (fastembed)</text>
<text x="1074" y="630" font-size="13" fill="#222"><tspan font-weight="bold">chunk_embedding</tspan><tspan fill="#777"> : VECTOR</tspan></text>
<text x="1084" y="647" font-size="11" fill="#555">on Chunk.embedding</text>
<text x="1084" y="662" font-size="11" fill="#888">384-d, cosine · semantic seed search</text>
<text x="1074" y="682" font-size="13" fill="#222"><tspan font-weight="bold">chunk_fulltext</tspan><tspan fill="#777"> : FULLTEXT</tspan></text>
<text x="1084" y="699" font-size="11" fill="#555">on Chunk.text</text>
<text x="1084" y="714" font-size="11" fill="#888">BM25, english analyzer · keyword half of hybrid</text>
<text x="1074" y="734" font-size="13" fill="#222"><tspan font-weight="bold">entity_embedding</tspan><tspan fill="#777"> : VECTOR</tspan></text>
<text x="1084" y="751" font-size="11" fill="#555">on Entity.embedding</text>
<text x="1084" y="766" font-size="11" fill="#888">384-d, cosine · question → entities (focus)</text>
<text x="40" y="1000" font-size="12" fill="#666">Boxes = node labels (like tables), rows = properties.</text>
<text x="40" y="1018" font-size="12" fill="#666">Arrows = relationship types, with counts. Only the facts carry properties.</text>
<text x="40" y="1036" font-size="12" fill="#666">Unique keys: Provision.id, Term.name, Entity.name, Chunk.id.</text>
